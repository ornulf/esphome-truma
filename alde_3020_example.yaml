# Alde 3020 HE - read status via LIN (ESP32 + LIN transceiver in slave mode)
# Uses fork https://github.com/ornulf/esphome-truma (raw_frames added)
# Temperatures: little-endian uint16, (value / 10) - 273
# PID 0x03 room setpoint, 0x04 hot water setpoint, 0x05 byte0 mode,
# 0x06 electric power (W), 0x07 actual room temperature

esphome:
  name: alde
  friendly_name: Alde

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: git
      url: https://github.com/ornulf/esphome-truma
    components: [truma_inetbox, uart]
    refresh: always

uart:
  - id: lin_uart_bus
    tx_pin: GPIO16
    rx_pin: GPIO17
    baud_rate: 9600
    data_bits: 8
    parity: NONE
    stop_bits: 2

truma_inetbox:
  id: lin
  uart_id: lin_uart_bus
  lin_checksum: VERSION_2

sensor:
  - platform: template
    name: "Alde Room temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 30s
    lambda: |-
      uint16_t r = id(lin).raw_frames[7][0] | (id(lin).raw_frames[7][1] << 8);
      if (r == 0 || r == 0xFFFF) return NAN;
      return r / 10.0f - 273.0f;

  - platform: template
    name: "Alde Room setpoint"
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    update_interval: 30s
    lambda: |-
      uint16_t r = id(lin).raw_frames[3][0] | (id(lin).raw_frames[3][1] << 8);
      if (r == 0 || r == 0xFFFF) return NAN;
      return r / 10.0f - 273.0f;

  - platform: template
    name: "Alde Hot water setpoint"
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      uint16_t r = id(lin).raw_frames[4][0] | (id(lin).raw_frames[4][1] << 8);
      if (r == 0 || r == 0xFFFF) return NAN;
      return r / 10.0f - 273.0f;

  - platform: template
    name: "Alde Electric power"
    unit_of_measurement: "W"
    device_class: power
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      uint16_t r = id(lin).raw_frames[6][0] | (id(lin).raw_frames[6][1] << 8);
      if (r == 0xFFFF) return NAN;
      return r;

binary_sensor:
  - platform: template
    name: "Alde On"
    lambda: |-
      return id(lin).raw_frames[5][0] != 0;

  - platform: template
    name: "Alde Gas"
    lambda: |-
      return (id(lin).raw_frames[5][0] & 0x04) != 0;

  - platform: template
    name: "Alde Gas priority"
    lambda: |-
      return (id(lin).raw_frames[5][0] & 0x01) != 0;

text_sensor:
  - platform: template
    name: "Alde Raw data"
    update_interval: 10s
    lambda: |-
      char buf[128];
      int n = 0;
      for (int p = 3; p <= 7; p++) {
        n += snprintf(buf + n, sizeof(buf) - n, "%02X:", p);
        for (int i = 0; i < 8; i++)
          n += snprintf(buf + n, sizeof(buf) - n, "%02X", id(lin).raw_frames[p][i]);
        n += snprintf(buf + n, sizeof(buf) - n, " ");
      }
      return std::string(buf);
